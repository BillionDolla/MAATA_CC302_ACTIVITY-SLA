-- 1. Create Database
CREATE DATABASE IF NOT EXISTS UniversityCourseEnrollmentDB;
USE UniversityCourseEnrollmentDB;

-- 2. Create Tables

-- STUDENT Table
CREATE TABLE STUDENT (
    student_id INT AUTO_INCREMENT PRIMARY KEY,
    first_name VARCHAR(50) NOT NULL,
    last_name VARCHAR(50) NOT NULL,
    email VARCHAR(100) UNIQUE NOT NULL,
    enrollment_date DATE NOT NULL
) ENGINE=InnoDB;

-- COURSE Table
CREATE TABLE COURSE (
    course_id INT AUTO_INCREMENT PRIMARY KEY,
    course_code VARCHAR(20) NOT NULL UNIQUE,
    course_name VARCHAR(100) NOT NULL,
    credits INT NOT NULL
) ENGINE=InnoDB;

-- INSTRUCTOR Table
CREATE TABLE INSTRUCTOR (
    instructor_id INT AUTO_INCREMENT PRIMARY KEY,
    first_name VARCHAR(50) NOT NULL,
    last_name VARCHAR(50) NOT NULL,
    email VARCHAR(100) UNIQUE NOT NULL,
    department VARCHAR(50) NOT NULL
) ENGINE=InnoDB;

-- CLASS Table
-- Foreign Keys: course_id (from COURSE), instructor_id (from INSTRUCTOR)
CREATE TABLE CLASS (
    class_id INT AUTO_INCREMENT PRIMARY KEY,
    course_id INT NOT NULL,
    instructor_id INT NOT NULL,
    semester VARCHAR(20) NOT NULL,
    year INT NOT NULL,
    CONSTRAINT fk_class_course 
        FOREIGN KEY (course_id) REFERENCES COURSE(course_id)
        ON DELETE RESTRICT ON UPDATE CASCADE,
    CONSTRAINT fk_class_instructor 
        FOREIGN KEY (instructor_id) REFERENCES INSTRUCTOR(instructor_id)
        ON DELETE RESTRICT ON UPDATE CASCADE
) ENGINE=InnoDB;

-- ENROLLMENT Table (Junction Table for STUDENT and CLASS)
-- Foreign Keys: student_id (from STUDENT), class_id (from CLASS)
CREATE TABLE ENROLLMENT (
    enrollment_id INT AUTO_INCREMENT PRIMARY KEY,
    student_id INT NOT NULL,
    class_id INT NOT NULL,
    enrollment_date DATE NOT NULL,
    grade VARCHAR(2),
    CONSTRAINT fk_enrollment_student 
        FOREIGN KEY (student_id) REFERENCES STUDENT(student_id)
        ON DELETE RESTRICT ON UPDATE CASCADE,
    CONSTRAINT fk_enrollment_class 
        FOREIGN KEY (class_id) REFERENCES CLASS(class_id)
        ON DELETE RESTRICT ON UPDATE CASCADE
) ENGINE=InnoDB;

